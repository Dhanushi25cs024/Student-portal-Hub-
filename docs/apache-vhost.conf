# ============================================================================
# StudentHub Portal - Apache Virtual Host Configuration (Practical 15)
# Charotar University of Science & Technology (CHARUSAT) - ITUE203
# ============================================================================
#
# Instructions for Local Deployment:
# 1. Open C:\xampp\apache\conf\extra\httpd-vhosts.conf in a text editor as Administrator.
# 2. Append the VirtualHost block below to the file.
# 3. Open C:\Windows\System32\drivers\etc\hosts as Administrator and add:
#       127.0.0.1    studenthub.local
# 4. In C:\xampp\apache\conf\httpd.conf, ensure this line is not commented (#):
#       Include conf/extra/httpd-vhosts.conf
# 5. Restart Apache via XAMPP Control Panel.
# 6. Open your web browser and navigate to: http://studenthub.local/
# ============================================================================

<VirtualHost *:80>
    ServerAdmin webmaster@studenthub.local
    DocumentRoot "D:/Cse sem 3/Web devlopement/StudentPortal Hub"
    ServerName studenthub.local
    ServerAlias www.studenthub.local

    <Directory "D:/Cse sem 3/Web devlopement/StudentPortal Hub">
        Options Indexes FollowSymLinks MultiViews
        AllowOverride All
        Require all granted

        # Set default directory index precedence to index.php then index.html
        DirectoryIndex index.php index.html
    </Directory>

    # Custom Logs
    ErrorLog "logs/studenthub_error.log"
    CustomLog "logs/studenthub_access.log" combined
</VirtualHost>
